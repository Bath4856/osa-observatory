version: '3.9'

services:
  osa-api:
    build: .
    container_name: osa-api
    ports:
      - "8000:8000"
    env_file:
      - api/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
