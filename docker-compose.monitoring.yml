# =============================================================================
# OSA Observatory -- Stack monitoring Sprint 17
# docker/docker-compose.monitoring.yml
#
# Usage :
#   cd G:\osa-observatory
#   docker compose -f docker/docker-compose.monitoring.yml up -d
#
# Acces :
#   Prometheus : http://localhost:9090
#   Grafana    : http://localhost:3000  (admin / osa_grafana_2026)
#
# Prerequis :
#   - API OSA tournant sur localhost:8000
#   - Fichier prometheus/prometheus.yml present
# =============================================================================

services:

  # -- Prometheus -------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: osa-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # -- Grafana ----------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: osa-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: osa_grafana_2026
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_SERVER_ROOT_URL:         "http://localhost:3000"
      GF_INSTALL_PLUGINS:         ""
    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  prometheus-data:
    name: osa-prometheus-data
  grafana-data:
    name: osa-grafana-data
