# =============================================================================
# OSA Observatory -- Nginx configuration production
# nginx/osa_prod.conf
#
# Cible : VPS OVH Ubuntu 24 -- septembre 2026
# Domaine : osa-observatory.africa
#
# Prerequis :
#   - Certbot installe : apt install certbot python3-certbot-nginx
#   - Certificat genere : certbot --nginx -d osa-observatory.africa
#   - API OSA tournant sur 127.0.0.1:8000 (pas expose publiquement)
#
# Apres certbot, les chemins ssl_certificate sont remplis automatiquement.
# =============================================================================

# -- Rate limiting reseau (premiere ligne de defense) -----------------------
limit_req_zone $binary_remote_addr zone=osa_global:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=osa_auth:1m    rate=2r/m;

server {
    listen 80;
    listen [::]:80;
    server_name osa-observatory.africa www.osa-observatory.africa;

    # Redirection HTTP -> HTTPS
    location / {
        return 301 https://osa-observatory.africa$request_uri;
    }

    # ACME challenge Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name osa-observatory.africa;

    # -- Certificats Let's Encrypt (remplis par certbot) --------------------
    ssl_certificate     /etc/letsencrypt/live/osa-observatory.africa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/osa-observatory.africa/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # -- Headers de securite ------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header X-Frame-Options           "DENY"                                          always;
    add_header Content-Security-Policy   "default-src 'none'; frame-ancestors 'none'"   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
    add_header X-OSA-Version             "Sprint-17"                                     always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()"      always;

    # -- Rate limiting reseau -----------------------------------------------
    limit_req zone=osa_global burst=50 nodelay;

    # Rate limit specifique sur les endpoints auth (anti-brute-force)
    location ~ ^/auth/ {
        limit_req zone=osa_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;
        proxy_buffering        off;
    }

    # -- Proxy principal vers FastAPI ----------------------------------------
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;
        proxy_buffering        off;
    }

    # -- /metrics : interdit depuis l'exterieur -----------------------------
    location /metrics {
        deny all;
        return 403;
    }

    # -- /docs et /redoc : acces restreint en production --------------------
    # Decommenter pour restreindre l'acces a la documentation
    # location ~ ^/(docs|redoc|openapi.json) {
    #     allow 127.0.0.1;
    #     deny  all;
    #     proxy_pass http://127.0.0.1:8000;
    # }

    # -- Logs ----------------------------------------------------------------
    access_log /var/log/nginx/osa_access.log;
    error_log  /var/log/nginx/osa_error.log warn;
}
