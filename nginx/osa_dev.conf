# =============================================================================
# OSA Observatory -- Nginx configuration developpement
# nginx/osa_dev.conf
#
# Architecture :
#   Client -> nginx:443 (TLS) -> FastAPI host:8000
#
# Prerequis :
#   - Certificats generes via mkcert (voir start_monitoring.ps1)
#   - API OSA tournant sur host.docker.internal:8000
#
# Usage via Docker (voir docker-compose.monitoring.yml) :
#   Le container nginx monte ce fichier depuis le repo OSA
# =============================================================================

server {
    listen 80;
    server_name localhost osa-local;

    # Redirection HTTP -> HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost osa-local;

    # -- Certificats (generes par mkcert) ------------------------------------
    ssl_certificate     /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;

    # -- Protocoles TLS modernes ---------------------------------------------
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # -- Headers de securite -------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "DENY"                                always;
    add_header Content-Security-Policy   "default-src 'none'"                  always;
    add_header X-OSA-Version             "Sprint-17"                           always;

    # -- Proxy vers FastAPI --------------------------------------------------
    location / {
        proxy_pass         http://host.docker.internal:8000;
        proxy_http_version 1.1;

        # Headers proxy
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        # Timeouts adaptes a l'API OSA (certains endpoints sont lents)
        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;

        # Buffer
        proxy_buffering    off;
    }

    # -- /metrics : acces local uniquement (monitoring interne) --------------
    location /metrics {
        proxy_pass         http://host.docker.internal:8000/metrics;
        proxy_set_header   X-Forwarded-For   $remote_addr;

        # Restreindre aux IPs locales
        allow 127.0.0.1;
        allow 172.16.0.0/12;  # reseau Docker
        deny  all;
    }

    # -- Logs ----------------------------------------------------------------
    access_log /var/log/nginx/osa_access.log;
    error_log  /var/log/nginx/osa_error.log warn;
}
